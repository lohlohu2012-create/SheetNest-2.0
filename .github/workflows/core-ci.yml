name: SheetNest Core CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSHEETNEST_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Core smoke and stress regressions
        run: ctest --test-dir build --output-on-failure
